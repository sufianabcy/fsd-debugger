[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsd"
version = "0.1.0"
description = "Step-by-step flow tracer for Spring Boot: follows startup and requests from the logs and explains failures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fsd = "fsd.cli:app"

[tool.setuptools.packages.find]
include = ["fsd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
