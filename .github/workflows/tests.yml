name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    env:
      # Windows pipes default to the ANSI code page, which has no ✓ or ✗;
      # fsd's panel goes to stderr and the tests read it back as UTF-8.
      PYTHONUTF8: "1"
    steps:
      # Keep tests/logs and the Java fixtures byte for byte as they were
      # captured: Windows runners would otherwise check them out with CRLF.
      - name: Check out without line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # The port test that names the listening program needs lsof; it is skipped
      # where there is none (Windows), and installed here in case a Linux image lacks it.
      - name: Install lsof (Linux)
        if: runner.os == 'Linux'
        run: command -v lsof || sudo apt-get install -y lsof
      - name: Test
        run: python -m pytest -q
